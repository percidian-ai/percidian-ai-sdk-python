name: Release
# Publishes this SDK to PyPI as `percidian`, at the version pyproject.toml carries. Run by hand only (Actions > Release > Run
# workflow), never on a push, pull request or tag. With publish off it only tests and builds the packages (the run's `packages`
# artifact). With publish on, and on main only, the PyPI job waits in the `pypi` environment for approval and publishes by trusted
# publishing: a short-lived OIDC token for this run, no stored token.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (main only); off, it only tests and builds
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Type check, tests, sdist and wheel
        run: |
          python -m pip install --quiet . "pytest>=9.0.3,<10" "pytest-asyncio>=1,<2" "mypy==1.13.0" "build==1.6.1"
          mypy src
          pytest -q
          python -m build --outdir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
  # Checks nothing out and runs no code of the repository's: only the built files reach the OIDC token.
  pypi:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/percidian
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
